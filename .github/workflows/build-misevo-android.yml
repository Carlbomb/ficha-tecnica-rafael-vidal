name: Build MISEVO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-mvp
    paths:
      - 'mobile/**'
      - '.github/workflows/build-misevo-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MISEVO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEVO-Android
          path: mobile/MISEVO.apk
          if-no-files-found: error
          retention-days: 30
