name: Build MISEVO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-mvp
    paths:
      - 'mobile/**'
      - '.github/workflows/build-misevo-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate official MISEVO Android icon
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          S=1024
          im=Image.new("RGBA",(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
          white=(255,255,255,255); gold=(212,166,42,255)
          # chef hat
          d.ellipse((410,120,614,324),fill=gold); d.ellipse((315,190,505,380),fill=gold); d.ellipse((519,190,709,380),fill=gold); d.rounded_rectangle((370,245,654,400),55,fill=gold)
          # M mark
          d.polygon([(210,385),(360,385),(512,540),(664,385),(814,385),(814,780),(664,780),(664,590),(512,742),(360,590),(360,780),(210,780)],fill=white)
          d.rounded_rectangle((430,835,594,875),18,fill=gold)
          im.save("assets/misevo-icon.png")
          PY

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MISEVO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEVO-Android
          path: mobile/MISEVO.apk
          if-no-files-found: error
          retention-days: 30
