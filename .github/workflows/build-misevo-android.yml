name: Build MISEVO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-mvp
    paths:
      - 'mobile/**'
      - '.github/workflows/build-misevo-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate official MISEVO Android icon
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import struct, zlib
          W=H=1024
          bg=(0,0,0,0); white=(255,255,255,255); gold=(212,166,42,255)
          px=[list(bg) for _ in range(W*H)]
          def rect(x0,y0,x1,y1,c):
              for y in range(max(0,y0),min(H,y1)):
                  for x in range(max(0,x0),min(W,x1)): px[y*W+x]=list(c)
          def circle(cx,cy,r,c):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  dy=(y-cy)*(y-cy)
                  for x in range(max(0,cx-r),min(W,cx+r+1)):
                      if (x-cx)*(x-cx)+dy<=rr: px[y*W+x]=list(c)
          def poly(points,c):
              ys=[p[1] for p in points]
              for y in range(max(0,min(ys)),min(H,max(ys)+1)):
                  xs=[]
                  for i,p in enumerate(points):
                      q=points[(i+1)%len(points)]
                      if (p[1]<=y<q[1]) or (q[1]<=y<p[1]):
                          xs.append(int(p[0]+(y-p[1])*(q[0]-p[0])/(q[1]-p[1])))
                  xs.sort()
                  for i in range(0,len(xs)-1,2): rect(xs[i],y,xs[i+1]+1,y+1,c)
          circle(512,220,102,gold); circle(417,285,95,gold); circle(607,285,95,gold); rect(370,285,654,400,gold)
          poly([(210,385),(360,385),(512,540),(664,385),(814,385),(814,780),(664,780),(664,590),(512,742),(360,590),(360,780),(210,780)],white)
          rect(430,835,594,875,gold)
          raw=b''.join(b'\x00'+bytes(sum((px[y*W+x] for x in range(W)),[])) for y in range(H))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('assets/misevo-icon.png','wb').write(png)
          PY

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MISEVO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEVO-Android
          path: mobile/MISEVO.apk
          if-no-files-found: error
          retention-days: 30
