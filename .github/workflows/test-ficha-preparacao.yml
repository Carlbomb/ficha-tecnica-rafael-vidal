name: Testes MISEVO
on:
  push:
    branches: [mobile-mvp]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-ficha-preparacao.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Validar arquitetura e cadastros
        run: npm test
