<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <meta name="description" content="MISEVO — Gestão inteligente de cozinha">
  <title>MISEVO | Gestão inteligente de cozinha</title>
  <link rel="stylesheet" href="/style.css?v=9">
  <link rel="stylesheet" href="/auth.css?v=3">
</head>
<body class="auth-locked">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <small>GESTÃO INTELIGENTE DE COZINHA</small>
        <h1>MISEVO</h1>
        <p>Planeja · Organiza · Produz · Lucra</p>
      </div>
      <nav class="main-nav">
        <button type="button" data-tab="insumos" class="active"><span class="nav-icon">▦</span><span class="nav-text">Banco de Dados</span></button>
        <button type="button" data-tab="fichas"><span class="nav-icon">▤</span><span class="nav-text">Fichas Técnicas</span></button>
        <button type="button" data-tab="cmv"><span class="nav-icon">%</span><span class="nav-text">CMV</span></button>
        <button type="button" data-tab="usuarios" id="navUsuarios" hidden><span class="nav-icon">♙</span><span class="nav-text">Usuários</span></button>
      </nav>
      <button type="button" class="header-new" onclick="novaFicha()">+ Nova Ficha</button>
      <div class="sidebar-footer"><span>Mais controle para uma cozinha mais eficiente.</span><strong>MISEVO</strong></div>
    </aside>
    <div class="workspace">
      <header class="desktop-header">
        <div><small>PAINEL DE CONTROLE</small><h2>Gestão de Fichas Técnicas</h2></div>
        <button type="button" class="desktop-new" onclick="novaFicha()">+ Nova Ficha</button>
      </header>
      <main>
        <section class="stats">
          <article><span>Insumos</span><b id="ni">—</b></article>
          <article><span>Fichas Técnicas</span><b id="nf">—</b></article>
          <article><span>CMV Médio</span><b id="avg">—</b></article>
        </section>
        <section id="content" class="content-area"><div class="card">Carregando...</div></section>
      </main>
      <footer><span>Gestão inteligente de cozinha</span><strong>MISEVO</strong></footer>
    </div>
  </div>
  <script src="/auth-client.js?v=4"></script>
  <script src="/app.js?v=8"></script>
</body>
</html>
